services:
  - type: web
    name: megaseg
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/inicializar_postgres.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_ENV
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: megaseg-db
          property: connectionString
      - key: USE_POSTGRES
        value: "true"
      - key: USE_SQLITE
        value: "false"
      - key: RATELIMIT_STORAGE_URL
        value: memory://
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/megaseg/uploads
    healthCheckPath: /healthz
    disks:
      - name: megaseg-uploads
        mountPath: /var/data/megaseg
        sizeGB: 1

databases:
  - name: megaseg-db
    databaseName: megaseg
    user: megaseg
