<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="lens" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-cam)"/>
  
  <!-- Patrón de matriz tecnológica -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>
  
  <!-- Soporte y Cámara de Seguridad -->
  <path d="M 180,120 L 290,170 L 290,200 L 180,150 Z" fill="#334155"/>
  <rect x="270" y="140" width="300" height="130" rx="24" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <path d="M 270,140 L 570,140 L 520,110 L 290,110 Z" fill="#0F172A"/>
  
  <!-- Lente y Visión Nocturna -->
  <circle cx="550" cy="205" r="50" fill="#020617" stroke="#38BDF8" stroke-width="5"/>
  <circle cx="550" cy="205" r="32" fill="url(#lens)"/>
  <circle cx="550" cy="205" r="14" fill="#020617"/>
  <circle cx="558" cy="198" r="5" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Anillo de LEDs Infrarrojos -->
  <circle cx="550" cy="165" r="5" fill="#EF4444"/>
  <circle cx="585" cy="185" r="5" fill="#EF4444"/>
  <circle cx="585" cy="225" r="5" fill="#EF4444"/>
  <circle cx="550" cy="245" r="5" fill="#EF4444"/>
  <circle cx="515" cy="225" r="5" fill="#EF4444"/>
  <circle cx="515" cy="185" r="5" fill="#EF4444"/>
  
  <!-- Badge 4K ColorVu / En Vivo -->
  <rect x="290" y="315" width="220" height="48" rx="24" fill="#B91C1C"/>
  <text x="400" y="346" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="1">CCTV &amp; VÍDEO EN VIVO</text>
  <circle cx="315" cy="339" r="6" fill="#22C55E"/>
</svg>